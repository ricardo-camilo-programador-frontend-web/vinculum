name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes
    runs-on: self-hosted
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: echo "/home/camillusr/.hermes/node/bin" >> $GITHUB_PATH

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm run test

  security:
    name: Auditoria de Seguranca
    runs-on: self-hosted
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: echo "/home/camillusr/.hermes/node/bin" >> $GITHUB_PATH

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoria de vulnerabilidades
        shell: bash
        run: |
          set -o pipefail
          LOG_FILE="$(mktemp)"

          npm audit --audit-level moderate 2>&1 | tee "$LOG_FILE"
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if grep -Eq "500|503" "$LOG_FILE"; then
            echo "::warning::npm audit falhou por erro do registry."
            exit 0
          fi

          exit "$status"
