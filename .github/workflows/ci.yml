name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm run test

  security:
    name: Auditoria de Seguranca
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoria de vulnerabilidades
        shell: bash
        run: |
          set -o pipefail
          LOG_FILE="$(mktemp)"

          npm audit --audit-level moderate 2>&1 | tee "$LOG_FILE"
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          # npm audit can also fail due to transient registry errors
          if grep -Eq "500|503" "$LOG_FILE"; then
            echo "::warning::npm audit falhou por erro do registry. Falha tratada como indisponibilidade transitória."
            exit 0
          fi

          exit "$status"
